version: '3.8'

services:
  db:
    image: postgres:16
    container_name: soundbroad-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: soundbroad
      POSTGRES_PASSWORD: soundbroad
      POSTGRES_DB: soundbroad
    volumes:
      - db_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundbroad"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: soundbroad-backend-prod
    container_name: soundbroad-backend-prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      PGHOST: db
      PGPORT: 5432
      PGUSER: soundbroad
      PGPASSWORD: soundbroad
      PGDATABASE: soundbroad
      FILE_STORAGE_PATH: /usr/src/app/storage
    volumes:
      - backend_storage_prod:/usr/src/app/storage
    expose:
      - "4000"

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx.prod
    container_name: soundbroad-nginx-prod
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    environment:
      BACKEND_URL: http://backend:4000

volumes:
  db_data_prod:
  backend_storage_prod:
